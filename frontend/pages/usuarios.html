<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Usuarios — SAE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"/>
  <link rel="stylesheet" href="../css/custom.css"/>
  <style>
    body{font-family:'Nunito',sans-serif;background:#f3f4f8;}
    .app-sidebar{width:260px;min-height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:100;}
    .app-main{margin-left:260px;min-height:100vh;display:flex;flex-direction:column;}
    .nav-sidebar{padding:0 .5rem;}
    .nav-sidebar .nav-link{padding:.6rem .9rem;font-size:.88rem;font-weight:600;display:flex;align-items:center;}
    .sidebar-header{padding:.9rem 1rem .3rem;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);}
    .sidebar-footer{margin-top:auto;}
  </style>
</head>
<body>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
  if(!Auth.guardPage('ADMINISTRADOR')) throw new Error();
  Layout.init('usuarios');
  Layout.setBreadcrumb([{label:'Usuarios'}]);
</script>

<div class="d-flex align-items-center justify-content-between mb-4">
  <div>
    <h4 class="section-title mb-0"><i class="bi bi-person-gear me-2" style="color:#dc2626;"></i>Usuarios del Sistema</h4>
    <p class="text-muted mb-0" style="font-size:.88rem;">Gestión de accesos y roles</p>
  </div>
  <button class="btn btn-primary btn-sm px-3" onclick="abrirModal()">
    <i class="bi bi-plus-lg me-1"></i> Nuevo Usuario
  </button>
</div>

<div class="card">
  <div class="card-header d-flex align-items-center gap-3">
    <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Buscar usuario..." style="max-width:280px;"/>
    <span class="ms-auto text-muted" style="font-size:.82rem;" id="totalLabel">Cargando...</span>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr><th>#</th><th>Usuario</th><th>Estado</th><th class="text-end">Acciones</th></tr>
        </thead>
        <tbody id="tbodyUsuarios">
          <tr><td colspan="4" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="modalUsuario" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Nuevo Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="usuarioId"/>
        <div class="mb-3">
          <label class="form-label fw-600">Nombre de usuario *</label>
          <input type="text" class="form-control" id="usuario" placeholder="Sin espacios ni caracteres especiales"/>
        </div>
        <div class="mb-3" id="passwordField">
          <label class="form-label fw-600">Contraseña *</label>
          <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres"/>
          <div class="form-text text-muted" id="passHelpText">Requerida para nuevo usuario.</div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">Roles *</label>
          <div class="d-flex gap-3 flex-wrap" id="rolesCheckboxes">
            ${['ADMINISTRADOR','ADMINISTRATIVO','DOCENTE','ALUMNO'].map(r => `
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="${r}" id="rol_${r}"/>
                <label class="form-check-label" for="rol_${r}">${r}</label>
              </div>`).join('')}
          </div>
        </div>
        <div class="mb-2" id="activoField" style="display:none;">
          <label class="form-label fw-600">Estado</label>
          <select class="form-select" id="activo">
            <option value="1">Activo</option>
            <option value="0">Inactivo</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarUsuario()">
          Guardar <span class="spinner-border spinner-border-sm ms-1" id="spinGuardar" style="display:none;"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body p-4 text-center">
        <i class="bi bi-exclamation-triangle-fill text-warning fs-2 mb-3 d-block"></i>
        <p class="mb-0" id="confirmModalMsg"></p>
      </div>
      <div class="modal-footer justify-content-center border-0 pt-0 pb-3">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-danger btn-sm" id="confirmModalOk">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let usuarios = [];
let bsModal;

async function cargarDatos() {
  const r = await API.usuarios.list();
  usuarios = r?.data || [];
  renderUsuarios(usuarios);
}

function renderUsuarios(data) {
  document.getElementById('totalLabel').textContent = `${data.length} registros`;
  const tbody = document.getElementById('tbodyUsuarios');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-5">Sin usuarios</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(u => `
    <tr>
      <td class="text-muted">${u.id_usuario}</td>
      <td>
        <div class="d-flex align-items-center gap-2">
          <div style="width:32px;height:32px;background:#e0f2fe;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0369a1;font-weight:700;font-size:.8rem;flex-shrink:0;">
            ${u.usuario.charAt(0).toUpperCase()}
          </div>
          <span class="fw-600">${u.usuario}</span>
        </div>
      </td>
      <td><span class="badge ${u.activo ? 'bg-success' : 'bg-secondary'}">${u.activo ? 'Activo' : 'Inactivo'}</span></td>
      <td class="text-end">
        <button class="btn btn-outline-primary btn-action me-1" onclick="abrirModal(${u.id_usuario})" title="Editar"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-outline-danger btn-action" onclick="eliminarUsuario(${u.id_usuario}, '${u.usuario}')" title="Eliminar"><i class="bi bi-trash"></i></button>
      </td>
    </tr>`).join('');
}

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  renderUsuarios(usuarios.filter(u => u.usuario.toLowerCase().includes(q)));
});

function abrirModal(id = null) {
  document.getElementById('usuarioId').value = '';
  document.getElementById('usuario').value   = '';
  document.getElementById('password').value  = '';
  document.querySelectorAll('#rolesCheckboxes input').forEach(cb => cb.checked = false);
  document.getElementById('activoField').style.display = 'none';

  if (id) {
    const u = usuarios.find(x => x.id_usuario === id);
    if (!u) return;
    document.getElementById('modalTitle').textContent = 'Editar Usuario';
    document.getElementById('usuarioId').value = id;
    document.getElementById('usuario').value   = u.usuario;
    document.getElementById('activo').value    = u.activo ? '1' : '0';
    document.getElementById('activoField').style.display = '';
    document.getElementById('passHelpText').textContent = 'Déjala vacía para no cambiarla.';
  } else {
    document.getElementById('modalTitle').textContent = 'Nuevo Usuario';
    document.getElementById('passHelpText').textContent = 'Requerida para nuevo usuario.';
  }

  if (!bsModal) bsModal = new bootstrap.Modal(document.getElementById('modalUsuario'));
  bsModal.show();
}

async function guardarUsuario() {
  const id       = document.getElementById('usuarioId').value;
  const usuario  = document.getElementById('usuario').value.trim();
  const password = document.getElementById('password').value;
  const roles    = [...document.querySelectorAll('#rolesCheckboxes input:checked')].map(cb => cb.value);
  const activo   = document.getElementById('activo').value === '1';

  if (!usuario) { Toast.error('El nombre de usuario es requerido'); return; }
  if (!id && !password) { Toast.error('La contraseña es requerida para nuevos usuarios'); return; }
  if (!id && roles.length === 0) { Toast.error('Selecciona al menos un rol'); return; }

  const data = { usuario, activo };
  if (password) data.password = password;
  if (!id)      data.roles = roles;

  document.getElementById('spinGuardar').style.display = 'inline-block';
  const res = id ? await API.usuarios.update(id, data) : await API.usuarios.create(data);
  document.getElementById('spinGuardar').style.display = 'none';

  if (res?.success) { Toast.success(id ? 'Usuario actualizado' : 'Usuario creado'); bsModal.hide(); await cargarDatos(); }
  else Toast.error(res?.message || 'Error al guardar');
}

async function eliminarUsuario(id, nombre) {
  const ok = await confirmDialog(`¿Eliminar al usuario "${nombre}"? Se perderá todo su acceso.`);
  if (!ok) return;
  const res = await API.usuarios.delete(id);
  if (res?.success) { Toast.success('Usuario eliminado'); await cargarDatos(); }
  else Toast.error(res?.message || 'Error al eliminar');
}

cargarDatos();
</script>
</body>
</html>
