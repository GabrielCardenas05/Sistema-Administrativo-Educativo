<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Perfil — SAE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"/>
  <link rel="stylesheet" href="../css/custom.css"/>
  <style>
    body{font-family:'Nunito',sans-serif;background:#f3f4f8;}
    .app-sidebar{width:260px;min-height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:100;}
    .app-main{margin-left:260px;min-height:100vh;display:flex;flex-direction:column;}
    .nav-sidebar{padding:0 .5rem;}
    .nav-sidebar .nav-link{padding:.6rem .9rem;font-size:.88rem;font-weight:600;display:flex;align-items:center;}
    .sidebar-header{padding:.9rem 1rem .3rem;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);}
    .sidebar-footer{margin-top:auto;}
    .avatar-circle{width:80px;height:80px;background:linear-gradient(135deg,#1a6fc4,#0ea5e9);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;font-weight:700;}
    .info-row{display:flex;padding:.6rem 0;border-bottom:1px solid #f0f0f0;}
    .info-row:last-child{border-bottom:0;}
    .info-label{font-size:.8rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;min-width:140px;}
    .info-value{font-size:.9rem;color:#1f2937;font-weight:600;}
  </style>
</head>
<body>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
  if(!Auth.guardPage('ALUMNO')) throw new Error();
  Layout.init('mi-perfil');
  Layout.setBreadcrumb([{label:'Mi Perfil'}]);
</script>

<div id="perfilContent">
  <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(async () => {
  const [rPerfil, rCarreras] = await Promise.all([
    API.alumnos.me(),
    API.carreras.list(),
  ]);

  const div = document.getElementById('perfilContent');

  if (!rPerfil?.success) {
    div.innerHTML = '<div class="alert alert-warning">No se encontró tu perfil de alumno. Contacta al administrador.</div>';
    return;
  }

  const alumno  = rPerfil.data;
  const carrera = (rCarreras?.data || []).find(c => c.id_carrera === alumno.id_carrera);

  // Inscripciones del alumno
  const rInsc = await API.inscripciones.byAlumno(alumno.id_alumno);
  const inscripciones = rInsc?.data || [];

  const user = Auth.getUser();
  const inicial = (alumno.nombre || user.usuario).charAt(0).toUpperCase();
  const formatPago = (i) => {
    if (!i.estado_pago) return '<span class="badge bg-secondary">Sin registro</span>';
    const color = {PAGADO:'bg-success',PENDIENTE:'bg-warning text-dark',RECHAZADO:'bg-danger'}[i.estado_pago] || 'bg-secondary';
    return `<span class="badge ${color}">${i.estado_pago}</span>`;
  };

  div.innerHTML = `
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card text-center p-4">
          <div class="avatar-circle mx-auto mb-3">${inicial}</div>
          <h5 class="fw-700 mb-1">${alumno.nombre}</h5>
          <p class="text-muted mb-2" style="font-size:.88rem;">${carrera?.nombre || 'Sin carrera'}</p>
          <span class="badge bg-primary px-3 py-2">Semestre ${alumno.semestre}°</span>
          <hr/>
          <div class="info-row">
            <span class="info-label">Matrícula</span>
            <span class="info-value" style="color:#1a6fc4;">${alumno.matricula}</span>
          </div>
          <div class="info-row">
            <span class="info-label">CURP</span>
            <span class="info-value" style="font-size:.82rem;">${alumno.curp || '—'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Estatus</span>
            <span class="info-value">
              <span class="badge bg-success">${alumno.estatus}</span>
            </span>
          </div>
          <div class="info-row">
            <span class="info-label">Usuario</span>
            <span class="info-value">${user.usuario}</span>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card">
          <div class="card-header d-flex align-items-center">
            <i class="bi bi-clipboard2-check me-2 text-primary"></i>
            <span class="fw-700">Mis Inscripciones</span>
            <span class="badge bg-primary ms-2">${inscripciones.length}</span>
          </div>
          <div class="card-body p-0">
            ${inscripciones.length === 0
              ? `<div class="empty-state"><i class="bi bi-clipboard2-x"></i>Sin inscripciones registradas</div>`
              : `<div class="table-responsive">
                  <table class="table table-hover mb-0">
                    <thead class="table-light">
                      <tr><th>Materia</th><th>Periodo</th><th>Estado</th><th>Pago</th><th>Fecha</th></tr>
                    </thead>
                    <tbody>
                      ${inscripciones.map(i => {
                        const colorEstado = {PENDIENTE:'bg-warning text-dark',ACTIVA:'bg-success',BAJA:'bg-danger',FINALIZADA:'bg-secondary'};
                        const fecha = i.fecha_inscripcion ? new Date(i.fecha_inscripcion).toLocaleDateString('es-MX') : '—';
                        return `<tr>
                          <td><span class="fw-600">Materia #${i.id_materia}</span></td>
                          <td>${i.id_periodo}</td>
                          <td><span class="badge ${colorEstado[i.estado]||'bg-secondary'}">${i.estado}</span></td>
                          <td>${formatPago(i)}</td>
                          <td><small>${fecha}</small></td>
                        </tr>`;
                      }).join('')}
                    </tbody>
                  </table>
                </div>`
            }
          </div>
        </div>
      </div>
    </div>
  `;
})();
</script>
</body>
</html>
