<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Docentes — SAE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"/>
  <link rel="stylesheet" href="../css/custom.css"/>
  <style>
    body{font-family:'Nunito',sans-serif;background:#f3f4f8;}
    .app-sidebar{width:260px;min-height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:100;}
    .app-main{margin-left:260px;min-height:100vh;display:flex;flex-direction:column;}
    .nav-sidebar{padding:0 .5rem;}
    .nav-sidebar .nav-link{padding:.6rem .9rem;font-size:.88rem;font-weight:600;display:flex;align-items:center;}
    .sidebar-header{padding:.9rem 1rem .3rem;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);}
    .sidebar-footer{margin-top:auto;}
  </style>
</head>
<body>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
  if(!Auth.guardPage('ADMINISTRADOR','ADMINISTRATIVO')) throw new Error();
  Layout.init('docentes');
  Layout.setBreadcrumb([{label:'Docentes'}]);
</script>

<div class="d-flex align-items-center justify-content-between mb-4">
  <div>
    <h4 class="section-title mb-0"><i class="bi bi-person-badge me-2" style="color:#7c3aed;"></i>Docentes</h4>
    <p class="text-muted mb-0" style="font-size:.88rem;">Gestión del personal docente</p>
  </div>
  <button class="btn btn-primary btn-sm px-3" onclick="abrirModal()">
    <i class="bi bi-plus-lg me-1"></i> Nuevo Docente
  </button>
</div>

<div class="card">
  <div class="card-header d-flex align-items-center gap-3">
    <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Buscar docente..." style="max-width:280px;"/>
    <span class="ms-auto text-muted" style="font-size:.82rem;" id="totalLabel">Cargando...</span>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Especialidad</th>
            <th>ID Usuario</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbodyDocentes">
          <tr><td colspan="5" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalDocente" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Nuevo Docente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="docenteId"/>
        <div class="mb-3">
          <label class="form-label fw-600">ID Usuario *</label>
          <input type="number" class="form-control" id="id_usuario" placeholder="ID del usuario en el sistema"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">Nombre completo *</label>
          <input type="text" class="form-control" id="nombre" placeholder="Nombre y apellidos"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">Especialidad</label>
          <input type="text" class="form-control" id="especialidad" placeholder="Ej. Matemáticas, Programación..."/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarDocente()">
          <span id="btnGuardarText">Guardar</span>
          <span class="spinner-border spinner-border-sm ms-1" id="spinGuardar" style="display:none;"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body p-4 text-center">
        <i class="bi bi-exclamation-triangle-fill text-warning fs-2 mb-3 d-block"></i>
        <p class="mb-0" id="confirmModalMsg"></p>
      </div>
      <div class="modal-footer justify-content-center border-0 pt-0 pb-3">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-danger btn-sm" id="confirmModalOk">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let docentes = [];
let bsModal;

async function cargarDatos() {
  const r = await API.docentes.list();
  docentes = r?.data || [];
  renderDocentes(docentes);
}

function renderDocentes(data) {
  document.getElementById('totalLabel').textContent = `${data.length} registros`;
  const tbody = document.getElementById('tbodyDocentes');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-5"><i class="bi bi-person-badge" style="font-size:2rem;display:block;margin-bottom:.5rem;"></i>Sin docentes registrados</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(d => `
    <tr>
      <td class="text-muted">${d.id_docente}</td>
      <td><span class="fw-600">${d.nombre}</span></td>
      <td>${d.especialidad || '<span class="text-muted">—</span>'}</td>
      <td><span class="badge bg-light text-dark">#${d.id_usuario}</span></td>
      <td class="text-end">
        <button class="btn btn-outline-primary btn-action me-1" onclick="abrirModal(${d.id_docente})" title="Editar"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-outline-danger btn-action" onclick="eliminarDocente(${d.id_docente}, '${d.nombre}')" title="Eliminar"><i class="bi bi-trash"></i></button>
      </td>
    </tr>`).join('');
}

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  renderDocentes(docentes.filter(d => d.nombre.toLowerCase().includes(q) || (d.especialidad||'').toLowerCase().includes(q)));
});

function abrirModal(id = null) {
  document.getElementById('docenteId').value = '';
  document.getElementById('nombre').value = '';
  document.getElementById('especialidad').value = '';
  document.getElementById('id_usuario').value = '';

  if (id) {
    const d = docentes.find(x => x.id_docente === id);
    if (!d) return;
    document.getElementById('modalTitle').textContent = 'Editar Docente';
    document.getElementById('docenteId').value   = id;
    document.getElementById('nombre').value       = d.nombre;
    document.getElementById('especialidad').value = d.especialidad || '';
    document.getElementById('id_usuario').value   = d.id_usuario || '';
  } else {
    document.getElementById('modalTitle').textContent = 'Nuevo Docente';
  }

  if (!bsModal) bsModal = new bootstrap.Modal(document.getElementById('modalDocente'));
  bsModal.show();
}

async function guardarDocente() {
  const id = document.getElementById('docenteId').value;
  const data = {
    id_usuario:  parseInt(document.getElementById('id_usuario').value) || null,
    nombre:      document.getElementById('nombre').value.trim(),
    especialidad: document.getElementById('especialidad').value.trim() || null,
  };
  if (!data.nombre) { Toast.error('El nombre es requerido'); return; }

  document.getElementById('spinGuardar').style.display = 'inline-block';
  const res = id ? await API.docentes.update(id, data) : await API.docentes.create(data);
  document.getElementById('spinGuardar').style.display = 'none';

  if (res?.success) {
    Toast.success(id ? 'Docente actualizado' : 'Docente creado');
    bsModal.hide();
    await cargarDatos();
  } else {
    Toast.error(res?.message || 'Error al guardar');
  }
}

async function eliminarDocente(id, nombre) {
  const ok = await confirmDialog(`¿Eliminar al docente "${nombre}"?`);
  if (!ok) return;
  const res = await API.docentes.delete(id);
  if (res?.success) { Toast.success('Docente eliminado'); await cargarDatos(); }
  else Toast.error(res?.message || 'Error al eliminar');
}

cargarDatos();
</script>
</body>
</html>
