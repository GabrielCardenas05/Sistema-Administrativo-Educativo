<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscripciones — SAE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"/>
  <link rel="stylesheet" href="../css/custom.css"/>
  <style>
    body{font-family:'Nunito',sans-serif;background:#f3f4f8;}
    .app-sidebar{width:260px;min-height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:100;}
    .app-main{margin-left:260px;min-height:100vh;display:flex;flex-direction:column;}
    .nav-sidebar{padding:0 .5rem;}
    .nav-sidebar .nav-link{padding:.6rem .9rem;font-size:.88rem;font-weight:600;display:flex;align-items:center;}
    .sidebar-header{padding:.9rem 1rem .3rem;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);}
    .sidebar-footer{margin-top:auto;}
  </style>
</head>
<body>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
  if(!Auth.guardPage('ADMINISTRADOR','ADMINISTRATIVO','DOCENTE','ALUMNO')) throw new Error();
  Layout.init('inscripciones');
  Layout.setBreadcrumb([{label:'Inscripciones'}]);
</script>

<div class="d-flex align-items-center justify-content-between mb-4">
  <div>
    <h4 class="section-title mb-0"><i class="bi bi-clipboard2-check me-2" style="color:#0ea5e9;"></i>Inscripciones</h4>
    <p class="text-muted mb-0" style="font-size:.88rem;">Control de inscripciones de alumnos</p>
  </div>
  <button class="btn btn-primary btn-sm px-3" id="btnNuevaInscripcion" onclick="abrirModal()">
    <i class="bi bi-plus-lg me-1"></i> Nueva Inscripción
  </button>
</div>

<div class="card mb-3">
  <div class="card-body py-2">
    <div class="row g-2 align-items-center">
      <div class="col-md-4">
        <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Buscar por alumno o materia..."/>
      </div>
      <div class="col-md-3">
        <select class="form-select form-select-sm" id="filtroEstado">
          <option value="">Todos los estados</option>
          <option value="PENDIENTE">Pendiente</option>
          <option value="ACTIVA">Activa</option>
          <option value="BAJA">Baja</option>
          <option value="FINALIZADA">Finalizada</option>
        </select>
      </div>
      <div class="col text-end">
        <span class="text-muted" style="font-size:.82rem;" id="totalLabel">Cargando...</span>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr><th>#</th><th>Alumno</th><th>Materia</th><th>Horario</th><th>Periodo</th><th>Estado</th><th>Pago</th><th>Fecha</th><th class="text-end" id="thAcciones">Acciones</th></tr>
        </thead>
        <tbody id="tbodyInscripciones">
          <tr><td colspan="9" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="modalInscripcion" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nueva Inscripción</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-600">Alumno *</label>
          <select class="form-select" id="sel_alumno"><option value="">— Seleccionar alumno —</option></select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">Materia *</label>
          <select class="form-select" id="sel_materia"><option value="">— Seleccionar materia —</option></select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">ID Periodo *</label>
          <input type="number" class="form-control" id="id_periodo" placeholder="Ej. 1"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarInscripcion()">
          Guardar <span class="spinner-border spinner-border-sm ms-1" id="spinGuardar" style="display:none;"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal cambiar estado -->
<div class="modal fade" id="modalEstado" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Cambiar estado</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="estadoInscId"/>
        <select class="form-select" id="nuevoEstado">
          <option value="PENDIENTE">Pendiente</option>
          <option value="ACTIVA">Activa</option>
          <option value="BAJA">Baja</option>
          <option value="FINALIZADA">Finalizada</option>
        </select>
        <div class="mt-3" id="motivoBajaField" style="display:none;">
          <label class="form-label fw-600">Motivo de baja *</label>
          <textarea class="form-control" id="motivoBaja" rows="3" placeholder="Describe por qué se da de baja la inscripción"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="cambiarEstado()">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body p-4 text-center">
        <i class="bi bi-exclamation-triangle-fill text-warning fs-2 mb-3 d-block"></i>
        <p class="mb-0" id="confirmModalMsg"></p>
      </div>
      <div class="modal-footer justify-content-center border-0 pt-0 pb-3">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-danger btn-sm" id="confirmModalOk">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let inscripciones = [], alumnos = [], materias = [];
let bsModal, bsEstadoModal;
const canManage = Auth.hasRole('ADMINISTRADOR','ADMINISTRATIVO');
const isAlumno = Auth.hasRole('ALUMNO');
const isDocente = Auth.hasRole('DOCENTE');

if (!canManage) {
  document.getElementById('btnNuevaInscripcion').style.display = 'none';
  document.getElementById('thAcciones').textContent = 'Soporte';
}

async function cargarDatos() {
  materias = await API.materias.list().then(r => r?.data || []);

  if (canManage) {
    [inscripciones, alumnos] = await Promise.all([
      API.inscripciones.list().then(r => r?.data || []),
      API.alumnos.list().then(r => r?.data || []),
    ]);
  } else if (isAlumno) {
    const rPerfil = await API.alumnos.me();
    const perfil = rPerfil?.success ? rPerfil.data : null;
    alumnos = perfil ? [perfil] : [];
    inscripciones = perfil
      ? await API.inscripciones.byAlumno(perfil.id_alumno).then(r => r?.data || [])
      : [];
  } else if (isDocente) {
    [inscripciones, alumnos] = await Promise.all([
      API.inscripciones.list().then(r => r?.data || []),
      API.alumnos.list().then(r => r?.data || []),
    ]);
  }

  document.getElementById('sel_alumno').innerHTML = '<option value="">— Seleccionar alumno —</option>' +
    alumnos.map(a => `<option value="${a.id_alumno}">${a.nombre} (${a.matricula})</option>`).join('');
  document.getElementById('sel_materia').innerHTML = '<option value="">— Seleccionar materia —</option>' +
    materias.map(m => `<option value="${m.id_materia}">[${m.clave}] ${m.nombre}</option>`).join('');
  aplicarFiltros();
}

function aplicarFiltros() {
  const q  = document.getElementById('searchInput').value.toLowerCase();
  const fe = document.getElementById('filtroEstado').value;
  const filtradas = inscripciones.filter(i => {
    const al = alumnos.find(a => a.id_alumno === i.id_alumno);
    const ma = materias.find(m => m.id_materia === i.id_materia);
    const txt = `${al?.nombre || ''} ${ma?.nombre || ''}`.toLowerCase();
    return (!q || txt.includes(q)) && (!fe || i.estado === fe);
  });
  renderInscripciones(filtradas);
}

function formatHorario(materia) {
  if (!materia) return 'No registrado';
  const dia = materia.dia || materia.dia_semana || materia.dias;
  const hora = [materia.hora_inicio, materia.hora_fin].filter(Boolean).join(' - ');
  return [dia, hora].filter(Boolean).join(' · ') || 'No registrado';
}

function formatPago(inscripcion) {
  if (!inscripcion.estado_pago) {
    return '<span class="badge bg-secondary">Sin registro</span>';
  }
  const color = {
    PAGADO: 'bg-success',
    PENDIENTE: 'bg-warning text-dark',
    RECHAZADO: 'bg-danger',
  }[inscripcion.estado_pago] || 'bg-secondary';
  const monto = inscripcion.monto_pago != null ? `<br><small class="text-muted">$${Number(inscripcion.monto_pago).toFixed(2)}</small>` : '';
  return `<span class="badge ${color}">${inscripcion.estado_pago}</span>${monto}`;
}

function renderInscripciones(data) {
  document.getElementById('totalLabel').textContent = `${data.length} registros`;
  const tbody = document.getElementById('tbodyInscripciones');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-5"><i class="bi bi-clipboard2-x" style="font-size:2rem;display:block;"></i>Sin inscripciones</td></tr>';
    return;
  }
  const colorEstado = {PENDIENTE:'bg-warning text-dark',ACTIVA:'bg-success',BAJA:'bg-danger',FINALIZADA:'bg-secondary'};
  tbody.innerHTML = data.map(i => {
    const al = alumnos.find(a => a.id_alumno === i.id_alumno);
    const ma = materias.find(m => m.id_materia === i.id_materia);
    const fecha = i.fecha_inscripcion ? new Date(i.fecha_inscripcion).toLocaleDateString('es-MX') : '—';
    const horario = formatHorario(ma);
    return `<tr>
      <td class="text-muted">${i.id_inscripcion}</td>
      <td><span class="fw-600">${al?.nombre || '—'}</span><br><small class="text-muted">${al?.matricula || ''}</small></td>
      <td>${ma?.nombre || '—'}<br><small class="text-muted">${ma?.clave || ''}</small></td>
      <td><small class="${horario === 'No registrado' ? 'text-muted' : ''}">${horario}</small></td>
      <td class="text-center">${i.id_periodo}</td>
      <td><span class="badge ${colorEstado[i.estado] || 'bg-secondary'}">${i.estado}</span>${i.motivo_baja ? `<br><small class="text-muted">${i.motivo_baja}</small>` : ''}</td>
      <td>${formatPago(i)}</td>
      <td><small>${fecha}</small></td>
      ${canManage ? `<td class="text-end">
        <button class="btn btn-outline-secondary btn-action me-1" onclick="abrirModalEstado(${i.id_inscripcion}, '${i.estado}')" title="Cambiar estado"><i class="bi bi-arrow-repeat"></i></button>
        <button class="btn btn-outline-danger btn-action" onclick="eliminarInscripcion(${i.id_inscripcion})" title="Eliminar"><i class="bi bi-trash"></i></button>
      </td>` : `<td class="text-end">
        <button class="btn btn-outline-warning btn-action me-1" onclick="reportarTicket(${i.id_inscripcion}, 'MATERIA_INCORRECTA')" title="Reportar materia incorrecta"><i class="bi bi-exclamation-triangle"></i></button>
        <button class="btn btn-outline-info btn-action" onclick="reportarTicket(${i.id_inscripcion}, 'PAGO_NO_REFLEJADO')" title="Reportar pago no reflejado"><i class="bi bi-receipt"></i></button>
      </td>`}
    </tr>`;
  }).join('');
}

['searchInput','filtroEstado'].forEach(id =>
  document.getElementById(id).addEventListener('input', aplicarFiltros)
);

document.getElementById('nuevoEstado').addEventListener('change', function() {
  document.getElementById('motivoBajaField').style.display = this.value === 'BAJA' ? '' : 'none';
});

function abrirModal() {
  if (!canManage) return;
  document.getElementById('sel_alumno').value = '';
  document.getElementById('sel_materia').value = '';
  document.getElementById('id_periodo').value = '';
  if (!bsModal) bsModal = new bootstrap.Modal(document.getElementById('modalInscripcion'));
  bsModal.show();
}

async function reportarTicket(idInscripcion, tipo) {
  const titulo = tipo === 'PAGO_NO_REFLEJADO'
    ? 'Pago no reflejado'
    : 'Materia incorrecta en inscripción';
  const descripcion = tipo === 'PAGO_NO_REFLEJADO'
    ? `Reporto que el pago de la inscripción #${idInscripcion} no aparece reflejado correctamente.`
    : `Reporto que la inscripción #${idInscripcion} contiene una materia que no corresponde.`;

  const res = await API.tickets.create({
    tipo,
    titulo,
    descripcion,
    prioridad: 'ALTA',
    id_inscripcion: idInscripcion,
  });

  if (res?.success) Toast.success(`Ticket #${res.data.id_ticket} generado`);
  else Toast.error(res?.message || 'No se pudo generar el ticket');
}

async function guardarInscripcion() {
  if (!canManage) return;
  const data = {
    id_alumno:  parseInt(document.getElementById('sel_alumno').value) || null,
    id_materia: parseInt(document.getElementById('sel_materia').value) || null,
    id_periodo: parseInt(document.getElementById('id_periodo').value) || null,
  };
  if (!data.id_alumno || !data.id_materia || !data.id_periodo) { Toast.error('Todos los campos son requeridos'); return; }

  document.getElementById('spinGuardar').style.display = 'inline-block';
  const res = await API.inscripciones.create(data);
  document.getElementById('spinGuardar').style.display = 'none';

  if (res?.success) { Toast.success('Inscripción creada'); bsModal.hide(); await cargarDatos(); }
  else Toast.error(res?.message || 'Error al crear inscripción');
}

function abrirModalEstado(id, estado) {
  if (!canManage) return;
  document.getElementById('estadoInscId').value = id;
  document.getElementById('nuevoEstado').value  = estado;
  document.getElementById('motivoBaja').value = '';
  document.getElementById('motivoBajaField').style.display = estado === 'BAJA' ? '' : 'none';
  if (!bsEstadoModal) bsEstadoModal = new bootstrap.Modal(document.getElementById('modalEstado'));
  bsEstadoModal.show();
}

async function cambiarEstado() {
  if (!canManage) return;
  const id     = document.getElementById('estadoInscId').value;
  const estado = document.getElementById('nuevoEstado').value;
  const motivo = document.getElementById('motivoBaja').value.trim();
  if (estado === 'BAJA' && !motivo) { Toast.error('El motivo de baja es requerido'); return; }
  const res    = await API.inscripciones.estado(id, estado, motivo);
  if (res?.success) { Toast.success('Estado actualizado'); bsEstadoModal.hide(); await cargarDatos(); }
  else Toast.error(res?.message || 'Error');
}

async function eliminarInscripcion(id) {
  if (!canManage) return;
  const ok = await confirmDialog('¿Eliminar esta inscripción?');
  if (!ok) return;
  const res = await API.inscripciones.delete(id);
  if (res?.success) { Toast.success('Inscripción eliminada'); await cargarDatos(); }
  else Toast.error(res?.message || 'Error al eliminar');
}

cargarDatos();
</script>
</body>
</html>
