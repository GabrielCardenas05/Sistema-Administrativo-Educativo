<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carreras — SAE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"/>
  <link rel="stylesheet" href="../css/custom.css"/>
  <style>
    body{font-family:'Nunito',sans-serif;background:#f3f4f8;}
    .app-sidebar{width:260px;min-height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:100;}
    .app-main{margin-left:260px;min-height:100vh;display:flex;flex-direction:column;}
    .nav-sidebar{padding:0 .5rem;}
    .nav-sidebar .nav-link{padding:.6rem .9rem;font-size:.88rem;font-weight:600;display:flex;align-items:center;}
    .sidebar-header{padding:.9rem 1rem .3rem;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);}
    .sidebar-footer{margin-top:auto;}
  </style>
</head>
<body>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
  if(!Auth.guardPage('ADMINISTRADOR','ADMINISTRATIVO')) throw new Error();
  Layout.init('carreras');
  Layout.setBreadcrumb([{label:'Carreras'}]);
</script>

<div class="d-flex align-items-center justify-content-between mb-4">
  <div>
    <h4 class="section-title mb-0"><i class="bi bi-diagram-3 me-2" style="color:#059669;"></i>Carreras</h4>
    <p class="text-muted mb-0" style="font-size:.88rem;">Catálogo de carreras académicas</p>
  </div>
  <button class="btn btn-primary btn-sm px-3" onclick="abrirModal()" id="btnNuevo"
          style="display:none;">
    <i class="bi bi-plus-lg me-1"></i> Nueva Carrera
  </button>
</div>

<div class="card">
  <div class="card-header d-flex align-items-center gap-3">
    <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Buscar carrera..." style="max-width:280px;"/>
    <span class="ms-auto text-muted" style="font-size:.82rem;" id="totalLabel">Cargando...</span>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th><th>Nombre</th><th>Estado</th>
            <th class="text-end" id="thAcciones" style="display:none;">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbodyCarreras">
          <tr><td colspan="4" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="modalCarrera" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Nueva Carrera</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="carreraId"/>
        <div class="mb-3">
          <label class="form-label fw-600">Nombre de la carrera *</label>
          <input type="text" class="form-control" id="nombre" placeholder="Ej. Ingeniería en Sistemas"/>
        </div>
        <div class="mb-3" id="activaField" style="display:none;">
          <label class="form-label fw-600">Estado</label>
          <select class="form-select" id="activa">
            <option value="1">Activa</option>
            <option value="0">Inactiva</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarCarrera()">
          Guardar
          <span class="spinner-border spinner-border-sm ms-1" id="spinGuardar" style="display:none;"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body p-4 text-center">
        <i class="bi bi-exclamation-triangle-fill text-warning fs-2 mb-3 d-block"></i>
        <p class="mb-0" id="confirmModalMsg"></p>
      </div>
      <div class="modal-footer justify-content-center border-0 pt-0 pb-3">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-danger btn-sm" id="confirmModalOk">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let carreras = [];
let bsModal;
const isAdmin = Auth.hasRole('ADMINISTRADOR');
if (isAdmin) {
  document.getElementById('btnNuevo').style.display = 'inline-flex';
  document.getElementById('thAcciones').style.display = '';
}

async function cargarDatos() {
  const r = await API.carreras.list();
  carreras = r?.data || [];
  renderCarreras(carreras);
}

function renderCarreras(data) {
  document.getElementById('totalLabel').textContent = `${data.length} registros`;
  const tbody = document.getElementById('tbodyCarreras');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-5"><i class="bi bi-diagram-3" style="font-size:2rem;display:block;margin-bottom:.5rem;"></i>Sin carreras registradas</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(c => `
    <tr>
      <td class="text-muted">${c.id_carrera}</td>
      <td><span class="fw-600">${c.nombre}</span></td>
      <td><span class="badge ${c.activa ? 'bg-success' : 'bg-secondary'}">${c.activa ? 'Activa' : 'Inactiva'}</span></td>
      ${isAdmin ? `<td class="text-end">
        <button class="btn btn-outline-primary btn-action me-1" onclick="abrirModal(${c.id_carrera})"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-outline-danger btn-action" onclick="eliminarCarrera(${c.id_carrera}, '${c.nombre}')"><i class="bi bi-trash"></i></button>
      </td>` : ''}
    </tr>`).join('');
}

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  renderCarreras(carreras.filter(c => c.nombre.toLowerCase().includes(q)));
});

function abrirModal(id = null) {
  document.getElementById('carreraId').value = '';
  document.getElementById('nombre').value = '';
  document.getElementById('activaField').style.display = 'none';

  if (id) {
    const c = carreras.find(x => x.id_carrera === id);
    if (!c) return;
    document.getElementById('modalTitle').textContent = 'Editar Carrera';
    document.getElementById('carreraId').value = id;
    document.getElementById('nombre').value    = c.nombre;
    document.getElementById('activa').value    = c.activa ? '1' : '0';
    document.getElementById('activaField').style.display = '';
  } else {
    document.getElementById('modalTitle').textContent = 'Nueva Carrera';
  }

  if (!bsModal) bsModal = new bootstrap.Modal(document.getElementById('modalCarrera'));
  bsModal.show();
}

async function guardarCarrera() {
  const id = document.getElementById('carreraId').value;
  const data = {
    nombre: document.getElementById('nombre').value.trim(),
    activa: document.getElementById('activa').value === '1' ? 1 : 0,
  };
  if (!data.nombre) { Toast.error('El nombre es requerido'); return; }

  document.getElementById('spinGuardar').style.display = 'inline-block';
  const res = id ? await API.carreras.update(id, data) : await API.carreras.create(data);
  document.getElementById('spinGuardar').style.display = 'none';

  if (res?.success) { Toast.success(id ? 'Carrera actualizada' : 'Carrera creada'); bsModal.hide(); await cargarDatos(); }
  else Toast.error(res?.message || 'Error al guardar');
}

async function eliminarCarrera(id, nombre) {
  const ok = await confirmDialog(`¿Eliminar la carrera "${nombre}"?`);
  if (!ok) return;
  const res = await API.carreras.delete(id);
  if (res?.success) { Toast.success('Carrera eliminada'); await cargarDatos(); }
  else Toast.error(res?.message || 'Error al eliminar');
}

cargarDatos();
</script>
</body>
</html>
