<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tickets — SAE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"/>
  <link rel="stylesheet" href="../css/custom.css"/>
  <style>
    body{font-family:'Nunito',sans-serif;background:#f3f4f8;}
    .app-sidebar{width:260px;min-height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:100;}
    .app-main{margin-left:260px;min-height:100vh;display:flex;flex-direction:column;}
    .nav-sidebar{padding:0 .5rem;}
    .nav-sidebar .nav-link{padding:.6rem .9rem;font-size:.88rem;font-weight:600;display:flex;align-items:center;}
    .sidebar-header{padding:.9rem 1rem .3rem;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);}
    .sidebar-footer{margin-top:auto;}
  </style>
</head>
<body>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
  if(!Auth.guardPage()) throw new Error();
  Layout.init('tickets');
  Layout.setBreadcrumb([{label:'Tickets'}]);
</script>

<div class="d-flex align-items-center justify-content-between mb-4">
  <div>
    <h4 class="section-title mb-0"><i class="bi bi-ticket-detailed me-2" style="color:#64748b;"></i>Tickets de Soporte</h4>
    <p class="text-muted mb-0" style="font-size:.88rem;">Reporte de errores, materias incorrectas y pagos no reflejados</p>
  </div>
  <button class="btn btn-primary btn-sm px-3" onclick="abrirModal()">
    <i class="bi bi-plus-lg me-1"></i> Nuevo Ticket
  </button>
</div>

<div class="card mb-3">
  <div class="card-body py-2">
    <div class="row g-2 align-items-center">
      <div class="col-md-4">
        <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Buscar ticket..."/>
      </div>
      <div class="col-md-3">
        <select class="form-select form-select-sm" id="filtroEstatus">
          <option value="">Todos los estados</option>
          <option value="ABIERTO">Abierto</option>
          <option value="EN_REVISION">En revisión</option>
          <option value="RESUELTO">Resuelto</option>
          <option value="CERRADO">Cerrado</option>
        </select>
      </div>
      <div class="col text-end">
        <span class="text-muted" style="font-size:.82rem;" id="totalLabel">Cargando...</span>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr><th>#</th><th>Tipo</th><th>Título</th><th>Usuario</th><th>Prioridad</th><th>Estatus</th><th>Fecha</th><th class="text-end" id="thAcciones">Acciones</th></tr>
        </thead>
        <tbody id="tbodyTickets">
          <tr><td colspan="8" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="modalTicket" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nuevo Ticket</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-600">Tipo *</label>
          <select class="form-select" id="tipo">
            <option value="PAGO_NO_REFLEJADO">Pago no reflejado</option>
            <option value="MATERIA_INCORRECTA">Materia incorrecta</option>
            <option value="ERROR_SISTEMA">Error del sistema</option>
            <option value="OTRO">Otro</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">Prioridad</label>
          <select class="form-select" id="prioridad">
            <option value="MEDIA">Media</option>
            <option value="ALTA">Alta</option>
            <option value="BAJA">Baja</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">Título *</label>
          <input type="text" class="form-control" id="titulo" placeholder="Describe el problema en una línea"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">ID Inscripción</label>
          <input type="number" class="form-control" id="id_inscripcion" placeholder="Opcional"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">Descripción *</label>
          <textarea class="form-control" id="descripcion" rows="4" placeholder="Explica qué ocurrió y qué dato aparece incorrecto"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarTicket()">
          Guardar <span class="spinner-border spinner-border-sm ms-1" id="spinGuardar" style="display:none;"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let tickets = [];
let bsModal;
const canManage = Auth.hasRole('ADMINISTRADOR','ADMINISTRATIVO');

async function cargarDatos() {
  const r = await API.tickets.list();
  tickets = r?.data || [];
  renderTickets(tickets);
}

function aplicarFiltros() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const fe = document.getElementById('filtroEstatus').value;
  const data = tickets.filter(t => {
    const txt = `${t.tipo} ${t.titulo} ${t.descripcion} ${t.usuario}`.toLowerCase();
    return (!q || txt.includes(q)) && (!fe || t.estatus === fe);
  });
  renderTickets(data);
}

function renderTickets(data) {
  document.getElementById('totalLabel').textContent = `${data.length} registros`;
  const tbody = document.getElementById('tbodyTickets');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-5"><i class="bi bi-ticket-detailed" style="font-size:2rem;display:block;"></i>Sin tickets</td></tr>';
    return;
  }
  const colorEstatus = {ABIERTO:'bg-warning text-dark',EN_REVISION:'bg-info',RESUELTO:'bg-success',CERRADO:'bg-secondary'};
  const colorPrioridad = {ALTA:'bg-danger',MEDIA:'bg-primary',BAJA:'bg-secondary'};
  tbody.innerHTML = data.map(t => {
    const fecha = t.fecha_creacion ? new Date(t.fecha_creacion).toLocaleDateString('es-MX') : '—';
    return `<tr>
      <td class="text-muted">${t.id_ticket}</td>
      <td><small class="fw-700">${t.tipo.replaceAll('_', ' ')}</small></td>
      <td><span class="fw-600">${t.titulo}</span><br><small class="text-muted">${t.descripcion}</small></td>
      <td>${t.usuario}</td>
      <td><span class="badge ${colorPrioridad[t.prioridad] || 'bg-secondary'}">${t.prioridad}</span></td>
      <td><span class="badge ${colorEstatus[t.estatus] || 'bg-secondary'}">${t.estatus}</span></td>
      <td><small>${fecha}</small></td>
      <td class="text-end">
        ${canManage ? `<select class="form-select form-select-sm d-inline-block" style="width:130px;" onchange="cambiarEstatus(${t.id_ticket}, this.value)">
          <option value="ABIERTO" ${t.estatus === 'ABIERTO' ? 'selected' : ''}>Abierto</option>
          <option value="EN_REVISION" ${t.estatus === 'EN_REVISION' ? 'selected' : ''}>En revisión</option>
          <option value="RESUELTO" ${t.estatus === 'RESUELTO' ? 'selected' : ''}>Resuelto</option>
          <option value="CERRADO" ${t.estatus === 'CERRADO' ? 'selected' : ''}>Cerrado</option>
        </select>` : '<small class="text-muted">Solo lectura</small>'}
      </td>
    </tr>`;
  }).join('');
}

['searchInput','filtroEstatus'].forEach(id =>
  document.getElementById(id).addEventListener('input', aplicarFiltros)
);

function abrirModal() {
  document.getElementById('tipo').value = 'PAGO_NO_REFLEJADO';
  document.getElementById('prioridad').value = 'MEDIA';
  document.getElementById('titulo').value = '';
  document.getElementById('id_inscripcion').value = '';
  document.getElementById('descripcion').value = '';
  if (!bsModal) bsModal = new bootstrap.Modal(document.getElementById('modalTicket'));
  bsModal.show();
}

async function guardarTicket() {
  const data = {
    tipo: document.getElementById('tipo').value,
    prioridad: document.getElementById('prioridad').value,
    titulo: document.getElementById('titulo').value.trim(),
    descripcion: document.getElementById('descripcion').value.trim(),
  };
  const idInscripcion = parseInt(document.getElementById('id_inscripcion').value);
  if (idInscripcion) data.id_inscripcion = idInscripcion;
  if (!data.titulo || !data.descripcion) { Toast.error('Título y descripción son requeridos'); return; }

  document.getElementById('spinGuardar').style.display = 'inline-block';
  const res = await API.tickets.create(data);
  document.getElementById('spinGuardar').style.display = 'none';

  if (res?.success) { Toast.success('Ticket generado'); bsModal.hide(); await cargarDatos(); }
  else Toast.error(res?.message || 'Error al generar ticket');
}

async function cambiarEstatus(id, estatus) {
  const res = await API.tickets.status(id, estatus);
  if (res?.success) { Toast.success('Ticket actualizado'); await cargarDatos(); }
  else Toast.error(res?.message || 'Error al actualizar ticket');
}

cargarDatos();
</script>
</body>
</html>
