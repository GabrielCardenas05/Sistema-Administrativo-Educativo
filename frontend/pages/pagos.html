<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pagos — SAE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"/>
  <link rel="stylesheet" href="../css/custom.css"/>
  <style>
    body{font-family:'Nunito',sans-serif;background:#f3f4f8;}
    .app-sidebar{width:260px;min-height:100vh;position:fixed;top:0;left:0;display:flex;flex-direction:column;z-index:100;}
    .app-main{margin-left:260px;min-height:100vh;display:flex;flex-direction:column;}
    .nav-sidebar{padding:0 .5rem;}
    .nav-sidebar .nav-link{padding:.6rem .9rem;font-size:.88rem;font-weight:600;display:flex;align-items:center;}
    .sidebar-header{padding:.9rem 1rem .3rem;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);}
    .sidebar-footer{margin-top:auto;}
  </style>
</head>
<body>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
  if(!Auth.guardPage('ADMINISTRADOR','ADMINISTRATIVO')) throw new Error();
  Layout.init('pagos');
  Layout.setBreadcrumb([{label:'Pagos'}]);
</script>

<div class="d-flex align-items-center justify-content-between mb-4">
  <div>
    <h4 class="section-title mb-0"><i class="bi bi-cash-coin me-2" style="color:#16a34a;"></i>Pagos</h4>
    <p class="text-muted mb-0" style="font-size:.88rem;">Administración de pagos por inscripción</p>
  </div>
  <button class="btn btn-primary btn-sm px-3" onclick="abrirModal()">
    <i class="bi bi-plus-lg me-1"></i> Nuevo Pago
  </button>
</div>

<div class="card mb-3">
  <div class="card-body py-2">
    <div class="row g-2 align-items-center">
      <div class="col-md-4">
        <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Buscar alumno, materia o inscripción..."/>
      </div>
      <div class="col-md-3">
        <select class="form-select form-select-sm" id="filtroEstado">
          <option value="">Todos los estados</option>
          <option value="PENDIENTE">Pendiente</option>
          <option value="PAGADO">Pagado</option>
          <option value="RECHAZADO">Rechazado</option>
        </select>
      </div>
      <div class="col text-end">
        <span class="text-muted" style="font-size:.82rem;" id="totalLabel">Cargando...</span>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr><th>#</th><th>Inscripción</th><th>Alumno</th><th>Materia</th><th>Monto</th><th>Estado</th><th>Fecha pago</th><th class="text-end">Acciones</th></tr>
        </thead>
        <tbody id="tbodyPagos">
          <tr><td colspan="8" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="modalPago" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Nuevo Pago</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="pagoId"/>
        <div class="mb-3">
          <label class="form-label fw-600">Inscripción *</label>
          <select class="form-select" id="id_inscripcion"></select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">Monto *</label>
          <input type="number" class="form-control" id="monto" min="0.01" step="0.01" placeholder="1500.00"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600">Estado *</label>
          <select class="form-select" id="estado">
            <option value="PENDIENTE">Pendiente</option>
            <option value="PAGADO">Pagado</option>
            <option value="RECHAZADO">Rechazado</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label fw-600">Fecha de pago</label>
          <input type="datetime-local" class="form-control" id="fecha_pago"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarPago()">
          Guardar <span class="spinner-border spinner-border-sm ms-1" id="spinGuardar" style="display:none;"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let pagos = [], inscripciones = [], alumnos = [], materias = [];
let bsModal;

async function cargarDatos() {
  [pagos, inscripciones, alumnos, materias] = await Promise.all([
    API.pagos.list().then(r => r?.data || []),
    API.inscripciones.list().then(r => r?.data || []),
    API.alumnos.list().then(r => r?.data || []),
    API.materias.list().then(r => r?.data || []),
  ]);
  cargarSelectInscripciones();
  aplicarFiltros();
}

function getDetalleInscripcion(id) {
  const ins = inscripciones.find(i => Number(i.id_inscripcion) === Number(id));
  const alumno = ins ? alumnos.find(a => a.id_alumno === ins.id_alumno) : null;
  const materia = ins ? materias.find(m => m.id_materia === ins.id_materia) : null;
  return { ins, alumno, materia };
}

function cargarSelectInscripciones() {
  const select = document.getElementById('id_inscripcion');
  select.innerHTML = '<option value="">— Seleccionar inscripción —</option>' + inscripciones.map(i => {
    const { alumno, materia } = getDetalleInscripcion(i.id_inscripcion);
    const label = `#${i.id_inscripcion} · ${alumno?.nombre || 'Alumno'} · ${materia?.nombre || 'Materia'}`;
    return `<option value="${i.id_inscripcion}">${label}</option>`;
  }).join('');
}

function formatDate(value) {
  if (!value) return '—';
  const d = new Date(String(value).replace(' ', 'T'));
  if (Number.isNaN(d.getTime())) return value;
  return d.toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' });
}

function toDateTimeInput(value) {
  if (!value) return '';
  return String(value).replace(' ', 'T').slice(0, 16);
}

function aplicarFiltros() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const estado = document.getElementById('filtroEstado').value;
  const data = pagos.filter(p => {
    const { alumno, materia } = getDetalleInscripcion(p.id_inscripcion);
    const txt = `#${p.id_inscripcion} ${alumno?.nombre || ''} ${alumno?.matricula || ''} ${materia?.nombre || ''} ${materia?.clave || ''}`.toLowerCase();
    return (!q || txt.includes(q)) && (!estado || p.estado === estado);
  });
  renderPagos(data);
}

function renderPagos(data) {
  document.getElementById('totalLabel').textContent = `${data.length} registros`;
  const tbody = document.getElementById('tbodyPagos');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-5"><i class="bi bi-cash-coin" style="font-size:2rem;display:block;"></i>Sin pagos registrados</td></tr>';
    return;
  }
  const colorEstado = {PAGADO:'bg-success',PENDIENTE:'bg-warning text-dark',RECHAZADO:'bg-danger'};
  tbody.innerHTML = data.map(p => {
    const { alumno, materia } = getDetalleInscripcion(p.id_inscripcion);
    return `<tr>
      <td class="text-muted">${p.id_pago}</td>
      <td><span class="badge bg-light text-dark">#${p.id_inscripcion}</span></td>
      <td><span class="fw-600">${alumno?.nombre || '—'}</span><br><small class="text-muted">${alumno?.matricula || ''}</small></td>
      <td>${materia?.nombre || '—'}<br><small class="text-muted">${materia?.clave || ''}</small></td>
      <td class="fw-700">$${Number(p.monto || 0).toFixed(2)}</td>
      <td><span class="badge ${colorEstado[p.estado] || 'bg-secondary'}">${p.estado}</span></td>
      <td><small>${formatDate(p.fecha_pago)}</small></td>
      <td class="text-end">
        <button class="btn btn-outline-primary btn-action" onclick="abrirModal(${p.id_pago})" title="Editar pago"><i class="bi bi-pencil"></i></button>
      </td>
    </tr>`;
  }).join('');
}

['searchInput','filtroEstado'].forEach(id =>
  document.getElementById(id).addEventListener('input', aplicarFiltros)
);

function abrirModal(id = null) {
  document.getElementById('pagoId').value = '';
  document.getElementById('id_inscripcion').disabled = false;
  document.getElementById('id_inscripcion').value = '';
  document.getElementById('monto').value = '';
  document.getElementById('estado').value = 'PENDIENTE';
  document.getElementById('fecha_pago').value = '';
  document.getElementById('modalTitle').textContent = 'Nuevo Pago';

  if (id) {
    const pago = pagos.find(p => p.id_pago === id);
    if (!pago) return;
    document.getElementById('pagoId').value = pago.id_pago;
    document.getElementById('id_inscripcion').value = pago.id_inscripcion;
    document.getElementById('id_inscripcion').disabled = true;
    document.getElementById('monto').value = pago.monto;
    document.getElementById('estado').value = pago.estado;
    document.getElementById('fecha_pago').value = toDateTimeInput(pago.fecha_pago);
    document.getElementById('modalTitle').textContent = 'Editar Pago';
  }

  if (!bsModal) bsModal = new bootstrap.Modal(document.getElementById('modalPago'));
  bsModal.show();
}

async function guardarPago() {
  const id = document.getElementById('pagoId').value;
  const monto = parseFloat(document.getElementById('monto').value);
  const estado = document.getElementById('estado').value;
  const fecha = document.getElementById('fecha_pago').value;
  const data = { monto, estado };

  if (!monto || monto <= 0) { Toast.error('El monto debe ser mayor a cero'); return; }
  if (!id) {
    data.id_inscripcion = parseInt(document.getElementById('id_inscripcion').value);
    if (!data.id_inscripcion) { Toast.error('Selecciona una inscripción'); return; }
  }
  if (fecha) data.fecha_pago = fecha;
  if (estado !== 'PAGADO' && !fecha) data.fecha_pago = null;

  document.getElementById('spinGuardar').style.display = 'inline-block';
  const res = id ? await API.pagos.update(id, data) : await API.pagos.create(data);
  document.getElementById('spinGuardar').style.display = 'none';

  if (res?.success) { Toast.success(id ? 'Pago actualizado' : 'Pago registrado'); bsModal.hide(); await cargarDatos(); }
  else Toast.error(res?.message || 'Error al guardar pago');
}

cargarDatos();
</script>
</body>
</html>
