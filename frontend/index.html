<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión — Sistema Administrativo Educativo</title>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <!-- Nunito Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"/>

  <style>
    :root {
      --brand-primary: #1a6fc4;
      --brand-dark: #0f2544;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      background: linear-gradient(135deg, #0f2544 0%, #1a3a6b 55%, #1a6fc4 100%);
      position: relative;
      overflow: hidden;
    }
    .login-wrapper::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 15% 85%, rgba(14,165,233,.2) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(26,111,196,.25) 0%, transparent 45%);
    }
    /* Panel izquierdo decorativo */
    .login-brand {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      position: relative;
      z-index: 1;
    }
    .login-brand .brand-icon {
      width: 90px; height: 90px;
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(8px);
      border-radius: 1.5rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem; color: #fff;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255,255,255,.2);
    }
    .login-brand h1 { color: #fff; font-weight: 800; font-size: 1.9rem; text-align: center; }
    .login-brand p  { color: rgba(255,255,255,.65); margin-top: .5rem; text-align: center; font-size: .95rem; }
    .login-brand .features { list-style: none; margin-top: 2.5rem; }
    .login-brand .features li {
      color: rgba(255,255,255,.75);
      display: flex; align-items: center; gap: .7rem;
      margin-bottom: .85rem; font-size: .9rem;
    }
    .login-brand .features li i { color: #0ea5e9; font-size: 1.1rem; }

    /* Panel derecho con el form */
    .login-form-panel {
      width: 460px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2.5rem;
      position: relative;
      z-index: 1;
    }
    .login-form-panel .form-logo {
      width: 52px; height: 52px;
      background: var(--brand-primary);
      border-radius: .85rem;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.6rem;
      margin-bottom: 1.5rem;
    }
    .login-form-panel h2 { font-weight: 800; color: var(--brand-dark); font-size: 1.6rem; }
    .login-form-panel .subtitle { color: #6b7280; font-size: .88rem; margin-bottom: 2rem; }

    .form-label { font-weight: 600; font-size: .85rem; color: #374151; }
    .form-control {
      border-radius: .6rem; border: 1.5px solid #e5e7eb;
      padding: .65rem 1rem; font-size: .9rem;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-control:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(26,111,196,.12);
    }
    .input-group-text {
      background: #f9fafb; border: 1.5px solid #e5e7eb;
      border-radius: .6rem 0 0 .6rem; color: #9ca3af;
    }
    .input-group .form-control { border-radius: 0 .6rem .6rem 0; border-left: 0; }

    .btn-login {
      background: var(--brand-primary);
      color: #fff; border: 0;
      border-radius: .6rem; padding: .75rem; font-size: 1rem; font-weight: 700;
      width: 100%; transition: all .2s;
    }
    .btn-login:hover:not(:disabled) { background: #1558a0; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,111,196,.35); }
    .btn-login:disabled { opacity: .7; cursor: not-allowed; }

    .alert-error {
      background: #fef2f2; border: 1px solid #fecaca;
      color: #dc2626; border-radius: .6rem; padding: .75rem 1rem;
      font-size: .87rem; display: none;
    }

    @media (max-width: 768px) {
      .login-brand { display: none; }
      .login-form-panel { width: 100%; padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>
<div class="login-wrapper">

  <!-- Panel izquierdo -->
  <div class="login-brand">
    <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
    <h1>Sistema Administrativo<br>Educativo</h1>
    <p>Gestión escolar centralizada y eficiente</p>
    <ul class="features">
      <li><i class="bi bi-people-fill"></i> Gestión de alumnos y docentes</li>
      <li><i class="bi bi-journal-bookmark-fill"></i> Control académico por carrera</li>
      <li><i class="bi bi-clipboard2-check-fill"></i> Inscripciones y materias</li>
      <li><i class="bi bi-shield-lock-fill"></i> Acceso por roles y permisos</li>
    </ul>
  </div>

  <!-- Panel del formulario -->
  <div class="login-form-panel">
    <div class="form-logo"><i class="bi bi-box-arrow-in-right"></i></div>
    <h2>Bienvenido</h2>
    <p class="subtitle">Ingresa tus credenciales para continuar</p>

    <div class="alert-error" id="errorMsg">
      <i class="bi bi-exclamation-circle me-1"></i>
      <span id="errorText"></span>
    </div>

    <form id="loginForm" novalidate style="width:100%">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="usuario" name="usuario"
                 placeholder="Nombre de usuario" autocomplete="username" required/>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="Contraseña" autocomplete="current-password" required/>
          <button type="button" class="btn btn-outline-secondary border-start-0"
                  style="border-radius:0 .6rem .6rem 0;border:1.5px solid #e5e7eb;border-left:0;"
                  onclick="togglePass()">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <span id="btnText">Iniciar Sesión</span>
        <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2" style="display:none;"></span>
      </button>
    </form>

    <p style="margin-top:2.5rem;font-size:.78rem;color:#9ca3af;text-align:center;">
      Sistema Administrativo Educativo &copy; 2026
    </p>
  </div>
</div>

<script>
function togglePass() {
  const inp = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  icon.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const usuario  = document.getElementById('usuario').value.trim();
  const password = document.getElementById('password').value;
  const errDiv   = document.getElementById('errorMsg');
  const errText  = document.getElementById('errorText');
  const btnText  = document.getElementById('btnText');
  const spinner  = document.getElementById('btnSpinner');
  const btn      = document.getElementById('btnLogin');

  if (!usuario || !password) {
    errText.textContent = 'Completa todos los campos.';
    errDiv.style.display = 'block';
    return;
  }

  errDiv.style.display = 'none';
  btn.disabled = true;
  btnText.textContent = 'Verificando...';
  spinner.style.display = 'inline-block';

  try {
    const res = await fetch('http://localhost:5000/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, password })
    });
    const data = await res.json();

    if (res.ok && data.success) {
      localStorage.setItem('token', data.data.token);
      localStorage.setItem('user', JSON.stringify(data.data.usuario));
      window.location.href = 'pages/dashboard.html';
    } else {
      errText.textContent = data.message || 'Credenciales incorrectas.';
      errDiv.style.display = 'block';
    }
  } catch (err) {
    errText.textContent = 'No se pudo conectar al servidor. ¿Está corriendo el backend?';
    errDiv.style.display = 'block';
  } finally {
    btn.disabled = false;
    btnText.textContent = 'Iniciar Sesión';
    spinner.style.display = 'none';
  }
});

// Si ya hay sesión activa, redirigir
if (localStorage.getItem('token')) {
  window.location.href = 'pages/dashboard.html';
}
</script>
</body>
</html>
